id: doddle.conv.cro-heuristics
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "ux-researcher skill for heuristics."
inputs:
  - {name: page, type: string, required: true, description: "Page to review"}
outputs:
  - {name: review, type: markdown, description: "LIFT heuristic review"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: ux-researcher, needs: [run], produces: [review]}
on_fail: {retry: 1, fallback: manual_review}
