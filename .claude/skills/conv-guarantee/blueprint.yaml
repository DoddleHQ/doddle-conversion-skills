id: doddle.conv.conv-guarantee
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "offer-strategist skill for guarantee."
inputs:
  - {name: offer, type: string, required: true, description: "Offer"}
outputs:
  - {name: copy, type: markdown, description: "Guarantee copy"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: analyze, type: agent, ref: offer-strategist, needs: [inputs], produces: [copy]}
on_fail: {retry: 1, fallback: manual_review}
