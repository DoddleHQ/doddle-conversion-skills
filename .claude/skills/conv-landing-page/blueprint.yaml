id: doddle.conv.conv-landing-page
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "conversion-strategist skill for landing page."
inputs:
  - {name: offer, type: string, required: true, description: "Offer"}
  - {name: audience, type: string, required: false, description: "Audience"}
outputs:
  - {name: page, type: markdown, description: "Landing page"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.canva.design, required: false, fallback: manual_review}
integrations:
  - canva
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: conversion-strategist, needs: [run], produces: [page]}
on_fail: {retry: 1, fallback: manual_review}
