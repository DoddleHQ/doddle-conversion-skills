id: doddle.conv.conv-bundle-design
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "offer-strategist skill for bundle design."
inputs:
  - {name: price, type: number, required: true, description: "Bundle price"}
  - {name: bundle, type: string, required: true, description: "Items JSON"}
outputs:
  - {name: analysis, type: markdown, description: "Bundle analysis"}
  - {name: envelope, type: json, description: "Offer envelope"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["offer"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: offer-strategist, needs: [run], produces: [analysis]}
on_fail: {retry: 1, fallback: manual_review}
