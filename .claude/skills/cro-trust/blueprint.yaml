id: doddle.conv.cro-trust
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "ux-researcher skill for trust."
inputs:
  - {name: page, type: string, required: true, description: "Page"}
outputs:
  - {name: plan, type: markdown, description: "Trust signals plan"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: ux-researcher, needs: [run], produces: [plan]}
on_fail: {retry: 1, fallback: manual_review}
