id: doddle.conv.conv-geo-targeting
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "conversion-strategist skill for geo targeting."
inputs:
  - {name: markets, type: string, required: true, description: "Markets"}
outputs:
  - {name: plan, type: markdown, description: "Geo targeting plan"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: analyze, type: agent, ref: conversion-strategist, needs: [inputs], produces: [plan]}
on_fail: {retry: 1, fallback: manual_review}
