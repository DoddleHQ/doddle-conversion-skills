id: doddle.conv.conv-multivariate
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "experiment-lead skill for multivariate."
inputs:
  - {name: variants, type: string, required: true, description: "Variants"}
outputs:
  - {name: plan, type: markdown, description: "MVT plan"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["frameworks"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: experiment-lead, needs: [run], produces: [plan]}
on_fail: {retry: 1, fallback: manual_review}
