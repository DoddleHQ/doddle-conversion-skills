id: doddle.conv.conv-significance
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "experiment-lead skill for significance."
inputs:
  - {name: control_n, type: number, required: true, description: "Control visitors"}
  - {name: control_conv, type: number, required: true, description: "Control conversions"}
  - {name: variant_n, type: number, required: true, description: "Variant visitors"}
  - {name: variant_conv, type: number, required: true, description: "Variant conversions"}
outputs:
  - {name: result, type: markdown, description: "Significance result"}
  - {name: envelope, type: json, description: "AB envelope"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["ab-test"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: experiment-lead, needs: [run], produces: [result]}
on_fail: {retry: 1, fallback: manual_review}
