id: doddle.conv.conv-funnel
version: 0.1.0
kind: skill
engine: doddle-os>=1.0
description: "cro-analyst skill for funnel."
inputs:
  - {name: stages, type: string, required: true, description: "Stage counts"}
outputs:
  - {name: analysis, type: markdown, description: "Funnel analysis"}
  - {name: envelope, type: json, description: "Funnel envelope"}
tools:
  - {id: doddle.tool.cli.dconv, required: false, fallback: manual_review}
  - {id: doddle.tool.v1.ga4.getReport, required: false, fallback: manual_review}
integrations:
  - ga4
nodes:
  - {id: run, type: tool, ref: doddle.tool.cli.dconv, args: ["funnel"], needs: [inputs], produces: [envelope]}
  - {id: narrate, type: agent, ref: cro-analyst, needs: [run], produces: [analysis]}
on_fail: {retry: 1, fallback: manual_review}
